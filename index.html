<html lang="en">
<head>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike & Pedestrian Crashes - Wichita, KS</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Bike Website.css" />
</head>
<body>
    <div id="container">
        <div id="map"></div>
        <div id="sidebar">
            <div id="sidebar-header">
                <div class="title-box">
                    <h1>Bike & Pedestrian Crashes, 2026</h1>
                    <div class="title-box-btm"></div>
                </div>
                <p>Wichita, Kansas</p>
                <div id="view-mode-wrap">
                    <select id="view-mode" onchange="switchViewMode(this.value)">
                        <option value="crashes">Crash Locations</option>
                        <option value="ped-homes">Pedestrian Homes</option>
                        <option value="drv-homes">Driver Homes</option>
                    </select>
                </div>
            </div>
            <div id="stats">Loading data...</div>
            <div id="district-filter">
                <div id="district-filter-label">Filter by District</div>
                <div id="district-checkboxes">Loading districts...</div>
            </div>
            <div id="characteristics-filter">
                <div id="characteristics-filter-header">
                    <span id="characteristics-filter-label">Characteristics</span>
                    <button id="char-toggle-btn" onclick="toggleAllChars()">Select All</button>
                </div>
                <div id="characteristics-pills"></div>
            </div>
            <div id="char-chart-section">
                <div id="char-chart-label">Characteristic Counts</div>
                <div id="char-chart"></div>
            </div>
            <div id="sidebar-content">
                <div class="placeholder">Click on a marker to view crash details</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const DEFAULT_COLOR    = '#fb9a99';
        const FATALITY_COLOR   = '#6a3d9a';
        const CODE_RED_COLOR   = '#e31a1c';
        const CODE_YELLOW_COLOR = '#ff7f00';
        const CODE_GREEN_COLOR = '#33a02c';
        const DECLINE_COLOR    = '#1f78b4';
        const PEDESTRIAN_COLOR = '#cab2d6';
        const DRIVER_COLOR     = '#b15928';

        const ALL_SEVERITIES = ['Fatality','Code Red','Code Yellow','Code Green','Decline EMS/No injuries reported','Unsorted'];
        let selectedSeverities = new Set(ALL_SEVERITIES);

        function toggleSeverity(sev) {
            if (selectedSeverities.has(sev)) selectedSeverities.delete(sev);
            else selectedSeverities.add(sev);
            applyFilters();
        }

        let markers = [];
        let pedHomeMarkers = [];
        let drvHomeMarkers = [];
        let viewMode = 'crashes';
        let selectedMarker = null;
        let crashData = [];
        let homeLines = [];
        let districts = [];
        let crashDistricts = {};
        let pedHomeDistricts = {};
        let drvHomeDistricts = {};
        let selectedDistricts = new Set(['All']);
        let selectedCharacteristics = new Set();
        let allCharacteristics = [];
        let gravityMarkers = [];

        // ── Characteristics parsing ──────────────────────────────────────────

        function parseCharacteristics(raw) {
            if (!raw || raw === 'NULL') return [];
            const inner = raw.slice(1, -1); // strip outer { }
            const tags = [];
            let inQuote = false, current = '';
            for (const ch of inner) {
                if (ch === '"') { inQuote = !inQuote; }
                else if (ch === ',' && !inQuote) { tags.push(current.trim().toLowerCase()); current = ''; }
                else { current += ch; }
            }
            if (current.trim()) tags.push(current.trim().toLowerCase());
            return tags.filter(Boolean);
        }

        function buildCharacteristicsPills() {
            const container = document.getElementById('characteristics-pills');
            container.innerHTML = allCharacteristics.map(tag =>
                `<span class="char-pill" data-tag="${tag.replace(/"/g, '&quot;')}">${tag}</span>`
            ).join('');
            container.addEventListener('click', e => {
                const pill = e.target.closest('.char-pill');
                if (!pill) return;
                const tag = pill.dataset.tag;
                if (selectedCharacteristics.has(tag)) {
                    selectedCharacteristics.delete(tag);
                    pill.classList.remove('active');
                } else {
                    selectedCharacteristics.add(tag);
                    pill.classList.add('active');
                }
                document.getElementById('char-toggle-btn').textContent =
                    selectedCharacteristics.size === 0 ? 'Select All' : 'Deselect All';
                applyFilters();
            });
        }

        function toggleAllChars() {
            const btn = document.getElementById('char-toggle-btn');
            if (selectedCharacteristics.size === 0) {
                allCharacteristics.forEach(t => selectedCharacteristics.add(t));
                btn.textContent = 'Deselect All';
                document.querySelectorAll('.char-pill').forEach(p => p.classList.add('active'));
            } else {
                selectedCharacteristics.clear();
                btn.textContent = 'Select All';
                document.querySelectorAll('.char-pill').forEach(p => p.classList.remove('active'));
            }
            applyFilters();
        }

        // ── Combined filter ──────────────────────────────────────────────────

        function applyFilters() {
            const isAllDistricts = selectedDistricts.has('All') || selectedDistricts.size === 0;
            const isAllChars = selectedCharacteristics.size === 0;

            const districtMap = viewMode === 'ped-homes' ? pedHomeDistricts
                              : viewMode === 'drv-homes' ? drvHomeDistricts
                              : crashDistricts;

            const visibleCrashes = crashData.filter(crash => {
                const districtOk = isAllDistricts || selectedDistricts.has(districtMap[crash.incidentid]);
                const charOk = isAllChars || crash._tags.some(t => selectedCharacteristics.has(t));
                const sevOk = selectedSeverities.has(crash.accident_severity || 'Unsorted');
                return districtOk && charOk && sevOk;
            });
            const visibleIds = new Set(visibleCrashes.map(c => c.incidentid));

            markers.forEach(({ marker, data }) => {
                if (viewMode === 'crashes' && visibleIds.has(data.incidentid)) marker.addTo(map);
                else map.removeLayer(marker);
            });
            pedHomeMarkers.forEach(({ marker, data }) => {
                if (viewMode === 'ped-homes' && visibleIds.has(data.incidentid)) marker.addTo(map);
                else map.removeLayer(marker);
            });
            drvHomeMarkers.forEach(({ marker, data }) => {
                if (viewMode === 'drv-homes' && visibleIds.has(data.incidentid)) marker.addTo(map);
                else map.removeLayer(marker);
            });

            buildStatsHTML(visibleCrashes);
            buildCharChart(visibleCrashes);
            updateGravityMarkers(visibleCrashes);
        }

        function switchViewMode(mode) {
            viewMode = mode;
            if (selectedMarker) {
                selectedMarker.setStyle({ fillColor: getStatusColor(selectedMarker.severity), radius: 8 });
                selectedMarker = null;
                homeLines.forEach(l => map.removeLayer(l));
                homeLines = [];
            }
            document.getElementById('sidebar-content').innerHTML =
                '<div class="placeholder">Click on a marker to view crash details</div>';
            applyFilters();
        }

        function buildCharChart(visibleCrashes) {
            const counts = {};
            visibleCrashes.forEach(crash => {
                crash._tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
            });

            const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
            const container = document.getElementById('char-chart');
            if (!sorted.length) { container.innerHTML = '<span style="color:#999;font-size:11px;">No characteristics in view</span>'; return; }

            const max = sorted[0][1];
            container.innerHTML = sorted.map(([tag, count]) => `
                <div class="chart-row">
                    <div class="chart-label">${tag}</div>
                    <div class="chart-bar-wrap">
                        <div class="chart-bar" style="width:${(count / max * 100).toFixed(1)}%"></div>
                        <span class="chart-count">${count}</span>
                    </div>
                </div>
            `).join('');
        }

        function handleDistrictChange(checkbox) {
            if (checkbox.value === 'All') {
                selectedDistricts = new Set(['All']);
                document.querySelectorAll('#district-checkboxes input[type=checkbox]').forEach(cb => {
                    cb.checked = checkbox.checked;
                    if (cb.value !== 'All') selectedDistricts.add(cb.value);
                });
                if (!checkbox.checked) selectedDistricts = new Set();
            } else {
                selectedDistricts.delete('All');
                document.querySelector('#district-checkboxes input[value="All"]').checked = false;
                if (checkbox.checked) selectedDistricts.add(checkbox.value);
                else selectedDistricts.delete(checkbox.value);
            }
            applyFilters();
        }

        // ── Stats ────────────────────────────────────────────────────────────

        function getStatusColor(severity) {
            switch(severity) {
                case 'Fatality':                         return FATALITY_COLOR;
                case 'Code Red':                         return CODE_RED_COLOR;
                case 'Code Yellow':                      return CODE_YELLOW_COLOR;
                case 'Code Green':                       return CODE_GREEN_COLOR;
                case 'Decline EMS/No injuries reported': return DECLINE_COLOR;
                default:                                 return DEFAULT_COLOR;
            }
        }

        function median(arr) {
            if (!arr.length) return null;
            const sorted = [...arr].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        }

        function updateGravityMarkers(visibleCrashes) {
            gravityMarkers.forEach(m => map.removeLayer(m));
            gravityMarkers = [];

            if (viewMode !== 'crashes') return;

            const groups = {};
            visibleCrashes.forEach(crash => {
                const sev = crash.accident_severity || 'Unsorted';
                const lat = parseFloat(crash.latitude);
                const lng = parseFloat(crash.longitude);
                if (!isNaN(lat) && !isNaN(lng)) {
                    if (!groups[sev]) groups[sev] = { lats: [], lngs: [] };
                    groups[sev].lats.push(lat);
                    groups[sev].lngs.push(lng);
                }
            });

            Object.entries(groups).forEach(([sev, { lats, lngs }]) => {
                if (lats.length < 2) return;
                const medLat = median(lats);
                const medLng = median(lngs);
                const color = getStatusColor(sev);
                const m = L.circleMarker([medLat, medLng], {
                    radius: 13,
                    color: color,
                    weight: 3,
                    fillColor: '#ffffff',
                    fillOpacity: 0.85,
                    pane: 'markerPane',
                }).addTo(map);
                m.bindTooltip(`<strong>${sev}</strong><br>Median center (n=${lats.length})`, { sticky: true });
                gravityMarkers.push(m);
            });
        }

        function haversineDistance(lat1, lng1, lat2, lng2) {
            const R = 3958.8;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) ** 2 +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng/2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // Expects YYYY-MM-DD format (ISO date from SQL export)
        function calculateAge(dob, referenceDate) {
            if (!dob) return null;
            const [year, month, day] = dob.split('-').map(Number);
            const ref = referenceDate ? new Date(referenceDate) : new Date();
            const birthDate = new Date(year, month - 1, day);
            let age = ref.getFullYear() - birthDate.getFullYear();
            const m = ref.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && ref.getDate() < birthDate.getDate())) age--;
            return age;
        }

        function buildStatsHTML(visibleCrashes) {
            const fatalityCount   = visibleCrashes.filter(c => c.accident_severity === 'Fatality').length;
            const codeRedCount    = visibleCrashes.filter(c => c.accident_severity === 'Code Red').length;
            const codeYellowCount = visibleCrashes.filter(c => c.accident_severity === 'Code Yellow').length;
            const codeGreenCount  = visibleCrashes.filter(c => c.accident_severity === 'Code Green').length;
            const declineCount    = visibleCrashes.filter(c => c.accident_severity === 'Decline EMS/No injuries reported').length;
            const unknownCount    = visibleCrashes.filter(c => !c.accident_severity).length;

            const pedAges = [], driverAges = [], pedDists = [], driverDists = [];
            visibleCrashes.forEach(crash => {
                const crashLat = parseFloat(crash.latitude);
                const crashLng = parseFloat(crash.longitude);
                if (crash.pedestrian_dob)
                    pedAges.push(calculateAge(crash.pedestrian_dob, crash.accident_date));
                if (crash.driver_dob)
                    driverAges.push(calculateAge(crash.driver_dob, crash.accident_date));
                if (crash.pedestrian_home_lat && crash.pedestrian_home_lng)
                    pedDists.push(haversineDistance(parseFloat(crash.pedestrian_home_lat), parseFloat(crash.pedestrian_home_lng), crashLat, crashLng));
                if (crash.driver_home_lat && crash.driver_home_lng)
                    driverDists.push(haversineDistance(parseFloat(crash.driver_home_lat), parseFloat(crash.driver_home_lng), crashLat, crashLng));
            });

            const medPedAge     = median(pedAges)?.toFixed(0) ?? 'N/A';
            const medDriverAge  = median(driverAges)?.toFixed(0) ?? 'N/A';
            const medPedDist    = median(pedDists)?.toFixed(2) ?? 'N/A';
            const medDriverDist = median(driverDists)?.toFixed(2) ?? 'N/A';

            const sevRow = (label, sev, color, count) => {
                const on = selectedSeverities.has(sev);
                const style = `color:${color};cursor:pointer;${on ? '' : 'opacity:0.35;text-decoration:line-through;'}`;
                return `<div onclick="toggleSeverity('${sev}')" style="${style}"><strong>${label}:</strong> ${count}</div>`;
            };

            document.getElementById('stats').innerHTML = `
                <strong>Total Crashes:</strong> ${visibleCrashes.length}<br>
                ${sevRow('Fatality',    'Fatality',                         FATALITY_COLOR,    fatalityCount)}
                ${sevRow('Code Red',    'Code Red',                         CODE_RED_COLOR,    codeRedCount)}
                ${sevRow('Code Yellow', 'Code Yellow',                      CODE_YELLOW_COLOR, codeYellowCount)}
                ${sevRow('Code Green',  'Code Green',                       CODE_GREEN_COLOR,  codeGreenCount)}
                ${sevRow('Decline EMS', 'Decline EMS/No injuries reported', DECLINE_COLOR,     declineCount)}
                ${sevRow('Unsorted',    'Unsorted',                         DEFAULT_COLOR,     unknownCount)}
                <br>
                <strong style="color:${PEDESTRIAN_COLOR};">Median Ped Age:</strong> <span style="color:${PEDESTRIAN_COLOR};">${medPedAge}</span><br>
                <strong style="color:${DRIVER_COLOR};">Median Driver Age:</strong> <span style="color:${DRIVER_COLOR};">${medDriverAge}</span><br>
                <strong style="color:${PEDESTRIAN_COLOR};">Median Ped Distance:</strong> <span style="color:${PEDESTRIAN_COLOR};">${medPedDist} mi</span><br>
                <strong style="color:${DRIVER_COLOR};">Median Driver Distance:</strong> <span style="color:${DRIVER_COLOR};">${medDriverDist} mi</span>
            `;
        }

        // ── Districts ────────────────────────────────────────────────────────

        function pointInPolygon(lat, lng, geometry) {
            let inside = false;
            const rings = geometry.type === 'Polygon'
                ? [geometry.coordinates[0]]
                : geometry.coordinates.map(r => r[0]);
            for (const ring of rings) {
                for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                    const [xi, yi] = ring[i];
                    const [xj, yj] = ring[j];
                    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi))
                        inside = !inside;
                }
            }
            return inside;
        }

        function buildDistrictCheckboxes() {
            const names = districts.map(d => d.properties['COUNCIL']).filter(Boolean).sort();
            document.getElementById('district-checkboxes').innerHTML = `
                <label class="district-check">
                    <input type="checkbox" value="All" checked onchange="handleDistrictChange(this)"> All
                </label>
                ${names.map(name => `
                <label class="district-check">
                    <input type="checkbox" value="${name}" onchange="handleDistrictChange(this)"> ${name}
                </label>`).join('')}
            `;
        }

        function loadDistricts() {
            const url = 'https://gismaps.wichita.gov/ageweb/rest/services/COWGIS/Districts/MapServer/3/query?where=1%3D1&outFields=COUNCIL&outSR=4326&f=geojson';
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    districts = data.features;
                    crashData.forEach(crash => {
                        const id = crash.incidentid;

                        // Crash district
                        const lat = parseFloat(crash.latitude);
                        const lng = parseFloat(crash.longitude);
                        if (!isNaN(lat) && !isNaN(lng)) {
                            for (const d of districts) {
                                if (pointInPolygon(lat, lng, d.geometry)) {
                                    crashDistricts[id] = String(d.properties['COUNCIL']); break;
                                }
                            }
                        }

                        // Pedestrian home district
                        if (crash.pedestrian_home_lat && crash.pedestrian_home_lng) {
                            const pLat = parseFloat(crash.pedestrian_home_lat);
                            const pLng = parseFloat(crash.pedestrian_home_lng);
                            if (!isNaN(pLat) && !isNaN(pLng)) {
                                for (const d of districts) {
                                    if (pointInPolygon(pLat, pLng, d.geometry)) {
                                        pedHomeDistricts[id] = String(d.properties['COUNCIL']); break;
                                    }
                                }
                            }
                        }

                        // Driver home district
                        if (crash.driver_home_lat && crash.driver_home_lng) {
                            const dLat = parseFloat(crash.driver_home_lat);
                            const dLng = parseFloat(crash.driver_home_lng);
                            if (!isNaN(dLat) && !isNaN(dLng)) {
                                for (const d of districts) {
                                    if (pointInPolygon(dLat, dLng, d.geometry)) {
                                        drvHomeDistricts[id] = String(d.properties['COUNCIL']); break;
                                    }
                                }
                            }
                        }
                    });
                    buildDistrictCheckboxes();
                })
                .catch(() => {
                    document.getElementById('district-checkboxes').innerHTML = 'Could not load districts';
                });
        }

        // ── CSV loading ──────────────────────────────────────────────────────

        function parseCSVLine(line) {
            const result = [];
            let inQuote = false, current = '';
            for (const ch of line) {
                if (ch === '"') { inQuote = !inQuote; }
                else if (ch === ',' && !inQuote) { result.push(current); current = ''; }
                else { current += ch; }
            }
            result.push(current);
            return result;
        }

        function parseCSV(text) {
            const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
            const headers = parseCSVLine(lines[0]);
            return lines.slice(1).map(line => {
                const values = parseCSVLine(line);
                const obj = {};
                headers.forEach((h, i) => {
                    const v = values[i];
                    obj[h] = (v === 'NULL' || v === undefined || v === '') ? null : v;
                });
                return obj;
            });
        }

        function loadCrashData() {
            document.getElementById('stats').innerHTML = 'Loading data...';
            fetch('ped_crashes_2026.csv')
                .then(r => r.text())
                .then(text => {
                    crashData = parseCSV(text).filter(r => r.latitude && r.longitude);

                    // Parse characteristics and collect all unique tags
                    const charSet = new Set();
                    crashData.forEach(crash => {
                        crash._tags = parseCharacteristics(crash.characteristics);
                        crash._tags.forEach(t => charSet.add(t));
                    });
                    allCharacteristics = [...charSet].sort();
                    buildCharacteristicsPills();

                    buildStatsHTML(crashData);
                    buildCharChart(crashData);

                    crashData.forEach(crash => {
                        const lat = parseFloat(crash.latitude);
                        const lng = parseFloat(crash.longitude);
                        if (isNaN(lat) || isNaN(lng)) return;

                        // Crash marker
                        const marker = L.circleMarker([lat, lng], {
                            radius: 8,
                            fillColor: getStatusColor(crash.accident_severity),
                            color: 'white',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 1
                        }).addTo(map);
                        marker.incidentId = crash.incidentid;
                        marker.severity = crash.accident_severity;
                        marker.on('click', e => { L.DomEvent.stopPropagation(e); showIncidentDetails(crash, marker); });
                        markers.push({ marker, data: crash });

                        // Pedestrian home marker (hidden until ped-homes mode)
                        if (crash.pedestrian_home_lat && crash.pedestrian_home_lng) {
                            const pLat = parseFloat(crash.pedestrian_home_lat);
                            const pLng = parseFloat(crash.pedestrian_home_lng);
                            if (!isNaN(pLat) && !isNaN(pLng)) {
                                const pm = L.circleMarker([pLat, pLng], {
                                    radius: 8,
                                    fillColor: getStatusColor(crash.accident_severity),
                                    color: 'white',
                                    weight: 2,
                                    opacity: 1,
                                    fillOpacity: 1
                                });
                                pm.severity = crash.accident_severity;
                                pm.on('click', e => { L.DomEvent.stopPropagation(e); showIncidentDetails(crash, pm); });
                                pedHomeMarkers.push({ marker: pm, data: crash });
                            }
                        }

                        // Driver home marker (hidden until drv-homes mode)
                        if (crash.driver_home_lat && crash.driver_home_lng) {
                            const dLat = parseFloat(crash.driver_home_lat);
                            const dLng = parseFloat(crash.driver_home_lng);
                            if (!isNaN(dLat) && !isNaN(dLng)) {
                                const dm = L.circleMarker([dLat, dLng], {
                                    radius: 8,
                                    fillColor: getStatusColor(crash.accident_severity),
                                    color: 'white',
                                    weight: 2,
                                    opacity: 1,
                                    fillOpacity: 1
                                });
                                dm.severity = crash.accident_severity;
                                dm.on('click', e => { L.DomEvent.stopPropagation(e); showIncidentDetails(crash, dm); });
                                drvHomeMarkers.push({ marker: dm, data: crash });
                            }
                        }
                    });

                    if (markers.length > 0) {
                        const group = L.featureGroup(markers.map(m => m.marker));
                        map.fitBounds(group.getBounds().pad(0.1));
                    }

                    loadDistricts();
                })
                .catch(error => {
                    document.getElementById('stats').innerHTML =
                        `<strong style="color:#e74c3c;">Error loading data</strong><br>${error.message}`;
                    console.error('Error loading CSV:', error);
                });
        }

        // ── Map ──────────────────────────────────────────────────────────────

        const map = L.map('map').setView([37.6872, -97.3301], 12);

        L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=4f4c222f-cf1d-412d-a93a-e8bdaf1e4a3d', {
            maxZoom: 20,
            attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a>, &copy; <a href="https://stamen.com/">Stamen Design</a>, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        map.on('click', () => {
            if (selectedMarker) {
                selectedMarker.setStyle({ fillColor: getStatusColor(selectedMarker.severity), radius: 8 });
                selectedMarker = null;
                homeLines.forEach(l => map.removeLayer(l));
                homeLines = [];
            }
            document.getElementById('sidebar-content').innerHTML =
                '<div class="placeholder">Click on a marker to view crash details</div>';
        });

        // ── Incident details ─────────────────────────────────────────────────

        function buildHomeDistanceHTML(label, homeLat, homeLng, distStr, color) {
            if (!homeLat || !homeLng || !distStr) return '';
            return `
                <div class="detail-row">
                    <div class="detail-label" style="color:${color};">${label} Home</div>
                    <div class="detail-value"><span style="color:${color};">${distStr}</span></div>
                </div>`;
        }

        async function drawHomeLines(crash) {
            homeLines.forEach(l => map.removeLayer(l));
            homeLines = [];
            const crashLat = parseFloat(crash.latitude);
            const crashLng = parseFloat(crash.longitude);
            const distances = {};

            async function fetchRoute(fromLat, fromLng, color, key) {
                try {
                    const url = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${crashLng},${crashLat}?overview=full&geometries=geojson`;
                    const data = await (await fetch(url)).json();
                    if (data.routes?.length > 0) {
                        homeLines.push(L.geoJSON(data.routes[0].geometry, { style: { color, weight: 8, opacity: 1 } }).addTo(map));
                        const miles = data.routes[0].distance / 1609.34;
                        distances[key] = miles < 0.1 ? (miles * 5280).toFixed(0) + ' ft' : miles.toFixed(2) + ' mi';
                    }
                } catch (e) { console.warn('Route fetch failed', e); }
            }

            if (crash.pedestrian_home_lat && crash.pedestrian_home_lng)
                await fetchRoute(parseFloat(crash.pedestrian_home_lat), parseFloat(crash.pedestrian_home_lng), PEDESTRIAN_COLOR, 'pedestrian');
            if (crash.driver_home_lat && crash.driver_home_lng)
                await fetchRoute(parseFloat(crash.driver_home_lat), parseFloat(crash.driver_home_lng), DRIVER_COLOR, 'driver');

            return distances;
        }

        async function showIncidentDetails(crash, marker) {
            if (selectedMarker)
                selectedMarker.setStyle({ fillColor: getStatusColor(selectedMarker.severity), radius: 8 });

            marker.setStyle({ fillColor: getStatusColor(marker.severity), radius: 12 });
            selectedMarker = marker;

            const distances = await drawHomeLines(crash);

            let dateStr = 'Unknown date';
            if (crash.accident_date) {
                dateStr = new Date(crash.accident_date).toLocaleDateString('en-US', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            }

            document.getElementById('sidebar-content').innerHTML = `
                <div class="crash-details">
                    <h2>Crash Details</h2>

                    <div class="detail-row">
                        <div class="detail-label">Date & Time</div>
                        <div class="detail-value">${dateStr}</div>
                    </div>

                    ${crash.intersection ? `
                    <div class="detail-row">
                        <div class="detail-label">Intersection</div>
                        <div class="detail-value">${crash.intersection}</div>
                    </div>` : ''}

                    ${buildHomeDistanceHTML('Pedestrian', crash.pedestrian_home_lat, crash.pedestrian_home_lng, distances.pedestrian, PEDESTRIAN_COLOR)}
                    ${crash.pedestrian_dob ? `
                    <div class="detail-row">
                        <div class="detail-label" style="color:${PEDESTRIAN_COLOR};">Pedestrian Age</div>
                        <div class="detail-value" style="color:${PEDESTRIAN_COLOR};">${calculateAge(crash.pedestrian_dob, crash.accident_date)}</div>
                    </div>` : ''}

                    ${buildHomeDistanceHTML('Driver', crash.driver_home_lat, crash.driver_home_lng, distances.driver, DRIVER_COLOR)}
                    ${crash.driver_dob ? `
                    <div class="detail-row">
                        <div class="detail-label" style="color:${DRIVER_COLOR};">Driver Age</div>
                        <div class="detail-value" style="color:${DRIVER_COLOR};">${calculateAge(crash.driver_dob, crash.accident_date)}</div>
                    </div>` : ''}

                    ${crash.accident_severity ? `
                    <div class="detail-row">
                        <div class="detail-label" style="color:${getStatusColor(crash.accident_severity)};">Condition</div>
                        <div class="detail-value" style="color:${getStatusColor(crash.accident_severity)};">${crash.accident_severity}</div>
                    </div>` : ''}

                    ${crash._tags && crash._tags.length > 0 ? `
                    <div class="detail-row">
                        <div class="detail-label">Characteristics</div>
                        <div class="detail-value char-tag-list">
                            ${crash._tags.map(t => `<span class="char-tag">${t}</span>`).join('')}
                        </div>
                    </div>` : ''}

                    <div class="detail-row">
                        <div class="detail-label">Incident ID</div>
                        <div class="detail-value">${crash.incidentid || 'Unknown'}</div>
                    </div>
                </div>
            `;
        }

        loadCrashData();
    </script>
</body>
</html>
