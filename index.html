<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike & Pedestrian Crashes - Wichita, KS</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom styles -->
    <link rel="stylesheet" href="Bike Website.css" />
</head>
<body>
    <div id="container">
        <div id="map"></div>
        <div id="sidebar">
            <div id="sidebar-header">
                <h1>Bike & Pedestrian Crashes</h1>
                <p>Wichita, Kansas</p>
            </div>
            <div id="stats">
                Loading data...
            </div>
            <div id="sidebar-content">
                <div class="placeholder">
                    Click on a marker to view crash details
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const ACCENT_COLOR = '#377eb8';  
        const SELECTED_COLOR = '#3498db';  
        const FATALITY_COLOR = '#e41a1c';
        const PEDESTRIAN_COLOR = '#bebada';
        const DRIVER_COLOR = '#e7298a';    



        let fatalityList = {};

        // Load fatality data FIRST, then load crash data from API
        fetch('fatalities.json')
            .then(r => r.json())
            .then(data => { fatalityList = data; })
            .catch(() => console.log('No fatality data found'))
            .finally(() => {
                fetch('home_addresses.json')
                    .then(r => r.json())
                    .then(data => { homeAddresses = data; })
                    .catch(() => console.log('No home address data found'))
                    .finally(() => loadCrashData());
            });

        const map = L.map('map').setView([37.6872, -97.3301], 12);
        
        // Add Stadia Maps tiles
        L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=4f4c222f-cf1d-412d-a93a-e8bdaf1e4a3d', {
            maxZoom: 20,
            attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a>, &copy; <a href="https://stamen.com/">Stamen Design</a>, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        
        // Click on map to deselect marker
        map.on('click', function(e) {
            if (selectedMarker) {
                const isFatal = fatalityList[selectedMarker.incidentId] === true;
                selectedMarker.setStyle({
                    fillColor: isFatal ? FATALITY_COLOR : ACCENT_COLOR,
                    radius: 8
                });
                selectedMarker = null;
                homeLines.forEach(l => map.removeLayer(l));
                homeLines = [];
            }

            document.getElementById('sidebar-content').innerHTML = `
                <div class="placeholder">
                    Click on a marker to view crash details
                </div>
            `;
        });

        let markers = [];
        let selectedMarker = null;
        let crashData = [];
        let homeAddresses = {};
        let homeLines = [];

        // Load data from ArcGIS REST API
        function loadCrashData() {
            // ArcGIS REST API endpoint (Wichita city server)
            const apiUrl = 'https://gismaps.wichita.gov/ageweb/rest/services/OpenData/TrafficAccidents/FeatureServer/9/query';
            
            // Query parameters
            const params = new URLSearchParams({
                where: 'OFFENSE_CO IN (7020, 7070)',  // Get all records
                outFields: '*',  // Get all fields
                f: 'geojson',
                returnGeometry: 'true'
            });
            
            document.getElementById('stats').innerHTML = 'Loading data from Wichita Open Data...';
            
            fetch(`${apiUrl}?${params}`)
                .then(response => response.json())
                .then(data => {
                    if (!data.features || data.features.length === 0) {
                        throw new Error('No data returned from API');
                    }
                    
                    // Convert GeoJSON features to crash data format
                    crashData = data.features
                        .filter(feature => feature.geometry && feature.geometry.coordinates)
                        .map(feature => ({
                            LONGITUDE: feature.geometry.coordinates[0],
                            LATITUDE: feature.geometry.coordinates[1],
                            ...feature.properties
                        }));
                    
                    // Count fatalities
                    const fatalityCount = crashData.filter(crash => fatalityList[crash.INCIDENTID] === true).length;

                    // Update stats
                    document.getElementById('stats').innerHTML = `
                        <strong>Total Crashes:</strong> ${crashData.length}<br>
                        <strong style="color: #ff3d5c;">Total Fatalities:</strong> <span style="color: #ff3d5c;">${fatalityCount}</span>
                    `;    
                    
                    // Add markers to map
                    crashData.forEach((crash, index) => {
                        const lat = parseFloat(crash.LATITUDE);
                        const lng = parseFloat(crash.LONGITUDE);
                        
                        if (!isNaN(lat) && !isNaN(lng)) {
                            // Determine marker color based on fatality
                            const isFatal = fatalityList[crash.INCIDENTID] === true;
                            const markerColor = isFatal ? FATALITY_COLOR : ACCENT_COLOR;
                            
                            // Create custom marker
                            const marker = L.circleMarker([lat, lng], {
                                radius: 8,
                                fillColor: markerColor,
                                color: 'white',
                                weight: 2,
                                opacity: 1,
                                fillOpacity: 0.8
                            }).addTo(map);
                            
                            // Store incident ID for later reference
                            marker.incidentId = crash.INCIDENTID;
                            
                            // Click handler to show details in sidebar
                            marker.on('click', function(e) {
                                L.DomEvent.stopPropagation(e);
                                showIncidentDetails(crash, marker);
                            });
                            
                            markers.push({ marker: marker, data: crash });
                        }
                    });

                    // Fit map to show all markers
                    if (markers.length > 0) {
                        const group = L.featureGroup(markers.map(m => m.marker));
                        map.fitBounds(group.getBounds().pad(0.1));
                    }
                })
                .catch(error => {
                    document.getElementById('stats').innerHTML = `
                        <strong style="color: #e74c3c;">Error loading data</strong><br>
                        ${error.message}
                    `;
                    console.error('Error loading ArcGIS data:', error);
                });
        }
        
        function buildHomeDistanceHTML(label, homeCoords, distStr, color) {
            if (!homeCoords || homeCoords.lat == null || homeCoords.lng == null) return '';
            if (!distStr) return '';
            return `
                <div class="detail-row">
                    <div class="detail-label" style="color:${color};">${label} Home</div>
                    <div class="detail-value">
                        <strong>${distStr}</strong> <span style="color:#888; font-size:0.85em;"></span>
                    </div>
                </div>`;
}

        
        async function drawHomeLines(crash, addresses) {
            homeLines.forEach(l => map.removeLayer(l));
            homeLines = [];

            const crashLat = parseFloat(crash.LATITUDE);
            const crashLng = parseFloat(crash.LONGITUDE);
            const distances = {};

            async function fetchRoute(fromLat, fromLng, color, key) {
                try {
                    const url = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${crashLng},${crashLat}?overview=full&geometries=geojson`;
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.routes && data.routes.length > 0) {
                        const line = L.geoJSON(data.routes[0].geometry, {
                            style: { color, weight: 6, dashArray: '6, 8', opacity: 1}
                        }).addTo(map);
                        homeLines.push(line);
                        const meters = data.routes[0].distance;
                        const miles = meters / 1609.34;
                        distances[key] = miles < 0.1 ? (miles * 5280).toFixed(0) + ' ft' : miles.toFixed(2) + ' mi';
                    }
                } catch (e) { console.warn('Route fetch failed', e); }
            }

            if (addresses.pedestrian?.lat && addresses.pedestrian?.lng)
                await fetchRoute(addresses.pedestrian.lat, addresses.pedestrian.lng, PEDESTRIAN_COLOR, 'pedestrian');

            if (addresses.driver?.lat && addresses.driver?.lng)
                await fetchRoute(addresses.driver.lat, addresses.driver.lng, DRIVER_COLOR, 'driver');

            return distances;
        }

        async function showIncidentDetails(crash, marker) {
            // Reset previous marker
            if (selectedMarker) {
                const isFatal = fatalityList[selectedMarker.incidentId] === true;
                selectedMarker.setStyle({
                    fillColor: isFatal ? FATALITY_COLOR : ACCENT_COLOR,
                    radius: 8
                });
            }
            
            // Highlight selected marker
            marker.setStyle({
                fillColor: '#3498db',
                radius: 9
            });
            selectedMarker = marker;
            
            // Format date
            const crashLat = parseFloat(crash.LATITUDE);
            const crashLng = parseFloat(crash.LONGITUDE);
            const addresses = homeAddresses[crash.INCIDENTID] || {};
            const distances = await drawHomeLines(crash, addresses);
            let dateStr = 'Unknown date';
            if (crash.ACCIDENT_DATE) {
                const date = new Date(crash.ACCIDENT_DATE);
                dateStr = date.toLocaleDateString('en-US', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            
            // Build details HTML
            const detailsHTML = `
                <div class="crash-details">
                    <h2>Crash Details</h2>
                    
                    <div class="detail-row">
                        <div class="detail-label">Date & Time</div>
                        <div class="detail-value">${dateStr}</div>
                    </div>
                    
                    <div class="detail-row">
                        <div class="detail-label">Location</div>
                        <div class="detail-value">${crash.LOCATION || 'Unknown'}</div>
                    </div>
                    
                    ${crash.INTERSECTION ? `
                    <div class="detail-row">
                        <div class="detail-label">Intersection</div>
                        <div class="detail-value">${crash.INTERSECTION}</div>
                    </div>
                    ` : ''}
                    
                    ${crash.CROSS_STREET ? `
                    <div class="detail-row">
                        <div class="detail-label">Cross Street</div>
                        <div class="detail-value">${crash.CROSS_STREET}</div>
                    </div>
                    ` : ''}
                    ${buildHomeDistanceHTML('Pedestrian', addresses.pedestrian, distances.pedestrian, PEDESTRIAN_COLOR)}
                    ${buildHomeDistanceHTML('Driver', addresses.driver, distances.driver, DRIVER_COLOR)}
                    <div class="detail-row">
                        <div class="detail-label">City</div>
                        <div class="detail-value">${crash.CITY || 'Unknown'}, ${crash.STATE || ''} ${crash.POSTAL_CODE || ''}</div>
                    </div>
                    
                    <div class="detail-row">
                        <div class="detail-label">Offense Type</div>
                        <div class="detail-value">${crash.OFFENSE_DE || 'Unknown'}</div>
                    </div>
                    
                    ${fatalityList[crash.INCIDENTID] === true ? `
                    <div class="detail-row">
                        <div class="detail-label">Condition</div>
                        <div class="detail-value" style="color: ${FATALITY_COLOR}; font-weight: bold;">Fatality</div>
                    </div>
                    ` : ''}

                    <div class="detail-row">
                        <div class="detail-label">Incident ID</div>
                        <div class="detail-value">${crash.INCIDENTID || 'Unknown'}</div>
                    </div>
                    
                    <div class="detail-row">
                        <div class="detail-label">Coordinates</div>
                        <div class="detail-value">${crash.LATITUDE}, ${crash.LONGITUDE}</div>
                    </div>
                    
                    ${crash.DOWFULL && crash.MONTHFULL ? `
                    <div class="detail-row">
                        <div class="detail-label">Day of Week / Month</div>
                        <div class="detail-value">${crash.DOWFULL}, ${crash.MONTHFULL}</div>
                    </div>
                    ` : ''}
                    
                    ${crash.INCIDENTID ? `
                    <div class="detail-row">
                        <div class="detail-label">Crash Report</div>
                        <div onclick="window.open('photos/${crash.INCIDENTID}.pdf', '_blank')" 
                             style="cursor: pointer; position: relative;">
                            <iframe src="photos/${crash.INCIDENTID}.pdf" 
                                    style="width: 100%; height: 500px; margin-top: 10px; border-radius: 4px; border: none; pointer-events: none;"
                                    onerror="this.parentElement.style.display='none'"></iframe>
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
            
            document.getElementById('sidebar-content').innerHTML = detailsHTML;
        }
    </script>
</body>
</html>
